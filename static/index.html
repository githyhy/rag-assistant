<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>自动驾驶知识问答助手</title>
<style>
  :root{
    --bg:#050a12; --panel:#0a121d; --panel2:#0d1622;
    --line:#16202f; --line2:#1e2d42;
    --tx:#e8eef6; --tx2:#93a7bf; --tx3:#5f7a99;
    --cy:#38bdf8; --bl:#3b82f6; --gr:#34d399; --am:#fbbf24; --rd:#f87171; --pu:#a78bfa;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:var(--bg); color:var(--tx);
    font-family:"Microsoft YaHei","微软雅黑","PingFang SC",sans-serif;
    font-size:14px; -webkit-font-smoothing:antialiased;
  }
  ::-webkit-scrollbar{width:9px;}
  ::-webkit-scrollbar-thumb{background:#1c2a3d;border-radius:6px;}

  .app{display:flex;flex-direction:column;height:100vh;max-width:1000px;margin:0 auto;}

  /* ---------- header ---------- */
  header{
    flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    gap:14px;padding:14px 22px;background:var(--panel);border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .lg{
    width:38px;height:38px;border-radius:10px;flex:0 0 auto;
    background:linear-gradient(135deg,#3b82f6,#38bdf8);
    display:grid;place-items:center;box-shadow:0 6px 20px rgba(59,130,246,.3);
  }
  .brand h1{margin:0;font-size:16px;font-weight:700;letter-spacing:.3px;}
  .brand p{margin:3px 0 0;font-size:11.5px;color:var(--tx3);}
  .status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--tx2);}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--gr);box-shadow:0 0 8px var(--gr);}

  /* ---------- toolbar ---------- */
  .toolbar{
    flex:0 0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    padding:9px 22px;background:var(--panel2);border-bottom:1px solid var(--line);
    font-size:12px;color:var(--tx2);
  }
  .toolbar label{display:flex;align-items:center;gap:6px;cursor:pointer;}
  .toolbar select{
    background:#131c28;border:1px solid var(--line2);color:var(--tx);
    border-radius:6px;padding:4px 8px;font-size:12px;font-family:inherit;outline:none;
  }
  .toolbar input[type=checkbox]{accent-color:#38bdf8;width:14px;height:14px;}

  /* ---------- messages ---------- */
  main{flex:1;overflow-y:auto;padding:22px;scroll-behavior:smooth;}
  .msg{display:flex;gap:11px;margin-bottom:20px;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .msg .av{
    width:32px;height:32px;border-radius:9px;flex:0 0 auto;
    display:grid;place-items:center;font-size:13px;font-weight:700;
  }
  .msg.user{flex-direction:row-reverse;}
  .msg.user .av{background:#1e2d42;color:#93a7bf;}
  .msg.ai .av{background:linear-gradient(135deg,#3b82f6,#38bdf8);color:#04121f;}
  .body{max-width:78%;}
  .bubble{
    padding:12px 15px;border-radius:12px;line-height:1.75;font-size:14px;
    word-break:break-word;white-space:pre-wrap;
  }
  .msg.user .bubble{background:#16283c;border:1px solid #24405e;border-bottom-right-radius:4px;}
  .msg.ai .bubble{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px;}
  .bubble strong{color:#7dd3fc;}
  .bubble code{background:#0b1420;padding:1px 5px;border-radius:4px;font-size:13px;color:#7dd3fc;}
  .cite{
    display:inline-block;background:rgba(56,189,248,.14);color:var(--cy);
    border-radius:4px;padding:0 5px;font-size:12px;margin:0 1px;font-weight:600;
  }
  .meta{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;}
  .tag{font-size:11px;padding:2px 8px;border-radius:20px;line-height:17px;}
  .tag.retrieve{background:rgba(56,189,248,.13);color:var(--cy);}
  .tag.chat{background:rgba(52,211,153,.13);color:var(--gr);}
  .tag.reject{background:rgba(251,191,36,.13);color:var(--am);}
  .tag.err{background:rgba(248,113,113,.14);color:var(--rd);}

  /* ---------- references ---------- */
  .refs{margin-top:9px;border-top:1px dashed #1c2a3d;padding-top:9px;}
  .refs summary{cursor:pointer;font-size:12px;color:var(--tx2);outline:none;user-select:none;}
  .refs summary:hover{color:var(--cy);}
  .ref{padding:8px 0 8px 10px;border-left:2px solid #24405e;margin-top:8px;}
  .ref .rh{display:flex;align-items:center;gap:9px;font-size:12px;margin-bottom:4px;}
  .ref .src{color:#7dd3fc;font-weight:600;}
  .ref .sc{
    background:rgba(52,211,153,.12);color:var(--gr);
    border-radius:20px;padding:1px 7px;font-size:11px;
  }
  .ref .tx{font-size:12px;color:var(--tx3);line-height:1.65;}

  /* ---------- welcome ---------- */
  .welcome{max-width:640px;margin:34px auto;text-align:center;}
  .welcome h2{margin:0 0 8px;font-size:19px;}
  .welcome p{margin:0 0 22px;color:var(--tx2);font-size:13px;line-height:1.7;}
  .examples{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left;}
  .ex{
    background:var(--panel);border:1px solid var(--line);border-radius:9px;
    padding:11px 13px;cursor:pointer;font-size:12.5px;color:var(--tx2);transition:.15s;
  }
  .ex:hover{border-color:var(--cy);color:var(--tx);transform:translateY(-2px);}
  .ex span{display:block;font-size:11px;color:var(--tx3);margin-top:4px;}

  /* ---------- typing ---------- */
  .typing{display:flex;gap:4px;padding:4px 0;}
  .typing i{
    width:7px;height:7px;border-radius:50%;background:#38bdf8;opacity:.4;
    animation:blink 1.2s infinite;
  }
  .typing i:nth-child(2){animation-delay:.2s;} .typing i:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,60%,100%{opacity:.25;}30%{opacity:1;}}

  /* ---------- input ---------- */
  footer{flex:0 0 auto;padding:14px 22px 18px;background:var(--panel);border-top:1px solid var(--line);}
  .inputwrap{
    display:flex;align-items:flex-end;gap:10px;background:#0d1622;
    border:1px solid var(--line2);border-radius:11px;padding:9px 11px;transition:.15s;
  }
  .inputwrap:focus-within{border-color:var(--cy);}
  textarea{
    flex:1;background:none;border:none;outline:none;resize:none;color:var(--tx);
    font-family:inherit;font-size:14px;line-height:1.65;max-height:130px;min-height:24px;
  }
  textarea::placeholder{color:#4f6a86;}
  .send{
    flex:0 0 auto;width:36px;height:36px;border-radius:9px;border:none;cursor:pointer;
    background:linear-gradient(135deg,#38bdf8,#3b82f6);color:#04121f;
    display:grid;place-items:center;transition:.15s;
  }
  .send:hover:not(:disabled){filter:brightness(1.1);}
  .send:disabled{opacity:.35;cursor:not-allowed;}
  .hint{margin-top:8px;font-size:11px;color:var(--tx3);text-align:center;}
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="brand">
      <div class="lg">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#04121f" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 15.5 5.8 9.6A2 2 0 0 1 7.7 8.2h8.6a2 2 0 0 1 1.9 1.4L20 15.5v3.2a1 1 0 0 1-1 1h-1.3a1 1 0 0 1-1-1v-.9H7.3v.9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/>
          <path d="M4.5 15.5h15"/><circle cx="8" cy="16.9" r=".8"/><circle cx="16" cy="16.9" r=".8"/>
        </svg>
      </div>
      <div>
        <h1>自动驾驶知识问答助手</h1>
        <p id="modelInfo">基于 RAG 检索增强生成</p>
      </div>
    </div>
    <div class="status"><span class="dot"></span><span id="statusText">连接中…</span></div>
  </header>

  <div class="toolbar">
    <label>检索条数
      <select id="topK">
        <option value="1">1</option>
        <option value="3" selected>3</option>
        <option value="5">5</option>
      </select>
    </label>
    <label><input type="checkbox" id="useRouter" checked/> 启用意图路由</label>
    <label><input type="checkbox" id="showRefs" checked/> 显示引用来源</label>
    <button id="clearBtn" style="margin-left:auto;background:none;border:1px solid var(--line2);color:var(--tx2);border-radius:6px;padding:4px 11px;font-size:12px;cursor:pointer;font-family:inherit">清空对话</button>
  </div>

  <main id="chat">
    <div class="welcome" id="welcome">
      <h2>问我任何自动驾驶相关的问题</h2>
      <p>我会先从知识库里检索最相关的资料，再基于资料回答，并标注引用来源。<br/>知识库中没有的内容，我会明确告诉你"资料中没有"。</p>
      <div class="examples">
        <div class="ex" data-q="自动驾驶分为哪几个等级？">自动驾驶分为哪几个等级？<span>分级标准</span></div>
        <div class="ex" data-q="激光雷达和毫米波雷达有什么区别？">激光雷达和毫米波雷达有什么区别？<span>传感器对比</span></div>
        <div class="ex" data-q="BEV 和占用网络解决了什么问题？">BEV 和占用网络解决了什么问题？<span>感知技术</span></div>
        <div class="ex" data-q="ASIL 等级是怎么划分的？">ASIL 等级是怎么划分的？<span>功能安全</span></div>
        <div class="ex" data-q="什么是数据闭环？">什么是数据闭环？<span>数据工程</span></div>
        <div class="ex" data-q="特斯拉 FSD 最新版本号是多少？">特斯拉 FSD 最新版本号是多少？<span>试试"防幻觉"</span></div>
      </div>
    </div>
  </main>

  <footer>
    <div class="inputwrap">
      <textarea id="input" rows="1" placeholder="输入你的问题…（Enter 发送，Shift+Enter 换行）"></textarea>
      <button class="send" id="sendBtn" title="发送">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/>
        </svg>
      </button>
    </div>
    <div class="hint">回答由 AI 基于本地知识库生成，仅供参考</div>
  </footer>

</div>

<script>
const chatEl   = document.getElementById('chat');
const inputEl  = document.getElementById('input');
const sendBtn  = document.getElementById('sendBtn');
const topKEl   = document.getElementById('topK');
const routerEl = document.getElementById('useRouter');
const refsEl   = document.getElementById('showRefs');
const statusEl = document.getElementById('statusText');
const modelEl  = document.getElementById('modelInfo');

let history = [];      // 多轮对话历史
let busy = false;

/* ---------------- 初始化：读后端状态 ---------------- */
fetch('/api/health').then(r => r.json()).then(res => {
  if (res.code !== 0) throw new Error(res.message);
  const d = res.data;
  statusEl.textContent = `就绪 · 知识库 ${d.vectors} 块`;
  modelEl.textContent = `${d.chat_model} + ${d.embed_model}`;
}).catch(() => {
  statusEl.textContent = '后端未就绪';
  statusEl.style.color = '#f87171';
});

/* ---------------- 工具函数 ---------------- */
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
// 极简 Markdown：粗体、行内代码、引用角标
function render(text){
  let t = escapeHtml(text);
  t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
  t = t.replace(/\[(\d+)\]/g, '<span class="cite">[$1]</span>');
  return t;
}
function scrollBottom(){
  chatEl.scrollTop = chatEl.scrollHeight;
}
function removeWelcome(){
  const w = document.getElementById('welcome');
  if (w) w.remove();
}

/* ---------------- 渲染消息 ---------------- */
function addUser(text){
  removeWelcome();
  const div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = `<div class="av">我</div><div class="body"><div class="bubble">${escapeHtml(text)}</div></div>`;
  chatEl.appendChild(div);
  scrollBottom();
}

function addTyping(){
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.id = 'typingMsg';
  div.innerHTML = `<div class="av">AI</div><div class="body"><div class="bubble"><div class="typing"><i></i><i></i><i></i></div></div></div>`;
  chatEl.appendChild(div);
  scrollBottom();
  return div;
}

function addAI(data){
  const t = document.getElementById('typingMsg');
  if (t) t.remove();

  const intentMap = {
    retrieve: ['retrieve', '知识库检索'],
    chat:     ['chat',     '日常对话'],
    reject:   ['reject',   '超出范围'],
  };
  const [cls, label] = intentMap[data.intent] || ['retrieve', data.intent || '检索'];

  let refsHtml = '';
  if (refsEl.checked && data.references && data.references.length) {
    const items = data.references.map(r => `
      <div class="ref">
        <div class="rh">
          <span class="src">${escapeHtml(r.source)}</span>
          <span class="sc">相似度 ${r.score.toFixed(3)}</span>
        </div>
        <div class="tx">${escapeHtml(r.text)}…</div>
      </div>`).join('');
    refsHtml = `<details class="refs" open><summary>引用来源（${data.references.length} 条）</summary>${items}</details>`;
  }

  const div = document.createElement('div');
  div.className = 'msg ai';
  div.innerHTML = `
    <div class="av">AI</div>
    <div class="body">
      <div class="bubble">${render(data.answer)}</div>
      <div class="meta"><span class="tag ${cls}">${label}</span></div>
      ${refsHtml}
    </div>`;
  chatEl.appendChild(div);
  scrollBottom();
}

function addError(msg){
  const t = document.getElementById('typingMsg');
  if (t) t.remove();
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.innerHTML = `
    <div class="av">AI</div>
    <div class="body">
      <div class="bubble" style="border-color:#7f1d1d">${escapeHtml(msg)}</div>
      <div class="meta"><span class="tag err">出错了</span></div>
    </div>`;
  chatEl.appendChild(div);
  scrollBottom();
}

/* ---------------- 发送 ---------------- */
async function send(question){
  if (busy) return;
  const q = (question !== undefined ? question : inputEl.value).trim();
  if (!q) return;

  busy = true;
  sendBtn.disabled = true;
  if (question === undefined) {
    inputEl.value = '';
    inputEl.style.height = 'auto';
  }

  addUser(q);
  addTyping();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        question: q,
        history: history,
        top_k: parseInt(topKEl.value, 10),
        use_router: routerEl.checked,
      }),
    });
    const json = await res.json();

    if (json.code !== 0) {
      addError(json.message || '请求失败');
    } else {
      addAI(json.data);
      // 记入历史，支持多轮追问
      history.push({ role: 'user', content: q });
      history.push({ role: 'assistant', content: json.data.answer });
      if (history.length > 10) history = history.slice(-10);   // 只留最近 5 轮
    }
  } catch (e) {
    addError('网络错误：' + e.message);
  } finally {
    busy = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

/* ---------------- 事件绑定 ---------------- */
sendBtn.addEventListener('click', () => send());

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 130) + 'px';
});

document.querySelectorAll('.ex').forEach(el => {
  el.addEventListener('click', () => send(el.dataset.q));
});

document.getElementById('clearBtn').addEventListener('click', () => {
  history = [];
  chatEl.innerHTML = '';
  location.reload();
});

refsEl.addEventListener('change', () => {
  document.querySelectorAll('.refs').forEach(d => { d.style.display = refsEl.checked ? '' : 'none'; });
});

inputEl.focus();
</script>
</body>
</html>
